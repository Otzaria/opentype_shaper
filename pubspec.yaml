name: opentype_shaper
description: "OpenType text shaping for Dart and Flutter: GSUB substitutions and GPOS mark positioning, returning glyph ids with per-glyph offsets."
version: 0.3.0
repository: https://github.com/Otzaria/opentype_shaper

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  # The build hook: the code asset, its signed precompiled binary and its hash.
  # Flutter 3.38 pins meta 1.17, supported by code_assets 1.x and hooks 2.0.x.
  code_assets: '>=1.2.1 <3.0.0'
  crypto: ^3.0.7
  ed25519_edwards: ^0.3.2
  # `calloc` for the reusable native scratch buffers.
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.0.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

